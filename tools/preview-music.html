<!doctype html><meta charset="utf-8"><title>Music preview render</title>
<p>Renders a scripted session through the real music engine. Used by tools/preview-music.mjs.</p>
<script type="module">
import {createEngine} from '../src/audio/engine.js';
// script: [[time, action, data]] — action is a stage name, 'song' (data = seed or null), 'tele' or a cue name.
window.renderPreview=async(seconds,script)=>{
  const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(seconds*sr),sr);
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(ctx.destination);
  const master=ctx.createGain();master.gain.value=0.8;master.connect(comp);
  const e=createEngine(ctx,master,{seed:'field'});e.setStage('idle',0,0.05);
  for(const [t,a,d] of script){e.scheduleUntil(t);
    if(a==='song')e.setSong(d,t);else if(a==='tele')e.setTele(d[0],d[1],d[2],t);else if(a.startsWith('stage:'))e.setStage(a.slice(6),t,d);else e.cue(a,d,t);}
  e.scheduleUntil(seconds);
  const buf=await ctx.startRendering();const n=buf.length,ch=2,data=new DataView(new ArrayBuffer(44+n*ch*2));const w=(o,s)=>[...s].forEach((c,i)=>data.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');data.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,ch,true);data.setUint32(24,sr,true);data.setUint32(28,sr*ch*2,true);data.setUint16(32,ch*2,true);data.setUint16(34,16,true);w(36,'data');data.setUint32(40,n*ch*2,true);
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let o=44;for(let i=0;i<n;i++){for(const c of [L,R]){const v=Math.max(-1,Math.min(1,c[i]));data.setInt16(o,v*32767,true);o+=2;}}
  return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(new Blob([data.buffer]));});};
</script>
