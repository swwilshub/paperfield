<!doctype html><meta charset="utf-8"><title>Music preview render</title>
<p>Renders a scripted session through the real mixer. Used by tools/preview-music.mjs.</p>
<script type="module">
import {createMixer} from '../src/audio/mixer.js';
window.renderPreview=async(seconds,script)=>{
  const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(seconds*sr),sr);const out=ctx.createGain();out.gain.value=1.3;out.connect(ctx.destination);
  const m=createMixer(ctx,out,{manual:true});m.setMood('idle');await m.start();
  const log=[];let si=0;const step=0.1;
  for(let t=step;t<seconds;t+=step){ctx.suspend(t).then(async()=>{
      while(si<script.length&&script[si][0]<=t){const [,mood,o]=script[si++];m.setMood(mood,o||{});log.push(`${t.toFixed(1)}s mood ${mood}`);}
      if(m.mood==='fly'){const k=(t%8)/8;m.tele(6+10*Math.sin(Math.PI*k),5*Math.sin(Math.PI*k));}
      m.tick();
      // give pending fetch/decode a chance to finish before rendering on
      for(let i=0;i<300&&m.state().waiting;i++)await new Promise(r=>setTimeout(r,10));
      const st=m.state();if(st.phrase!==log.lastPhrase){log.push(`${t.toFixed(1)}s phrase ${st.phrase}`);log.lastPhrase=st.phrase;}
      ctx.resume();});}
  const buf=await ctx.startRendering();
  // 16-bit WAV
  const n=buf.length,ch=2,data=new DataView(new ArrayBuffer(44+n*ch*2));const w=(o,s)=>[...s].forEach((c,i)=>data.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');data.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,ch,true);data.setUint32(24,sr,true);data.setUint32(28,sr*ch*2,true);data.setUint16(32,ch*2,true);data.setUint16(34,16,true);w(36,'data');data.setUint32(40,n*ch*2,true);
  const L=buf.getChannelData(0),Rr=buf.getChannelData(1);let o=44;for(let i=0;i<n;i++){for(const c of [L,Rr]){const v=Math.max(-1,Math.min(1,c[i]));data.setInt16(o,v*32767,true);o+=2;}}
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(new Blob([data.buffer]));});
  return{wav:b64,log};};
</script>
