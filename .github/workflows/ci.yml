name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics golden tests
        run: npm test
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test (local server, phone viewport)
        run: npx playwright test

  deploy:
    # Deploy from main, or from whatever branch is the repo default (today the only branch).
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the static site
        run: mkdir _site && cp -r index.html src styles assets legacy _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  pages-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Live Pages URL loads with no console errors
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test -g "no console errors"
